    <script src="./assets/js/gsap.min.js"></script>
    <link rel="stylesheet" href="./assets/css/film.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="65"
    >
      <div class="layer" id="layer-far"></div>
      <div class="layer" id="layer-mid"></div>
      <div class="layer" id="layer-line">
        <svg id="spine" viewBox="0 0 9600 1080" aria-hidden="true">
          <defs>
            <mask id="spine-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="9600" height="1080">
              <rect id="spine-window" x="250" y="0" width="0" height="1080" fill="#fff" />
              <!-- local erasers: where a studio replaces the line with its own gesture -->
              <rect id="gap-voice" x="4036" y="505" width="728" height="112" fill="#000" opacity="0" />
              <rect id="gap-engine" x="2500" y="498" width="800" height="132" fill="#000" opacity="0" />
            </mask>
          </defs>
          <g mask="url(#spine-mask)">
            <path class="halo" d="M250 560H9200" />
            <path class="core" d="M250 560H9200" />
            <g id="spine-ticks" opacity="0.5"></g>
          </g>
          <circle id="head-dot" cx="250" cy="560" r="4" fill="#ffffff" opacity="0" />
          <circle id="end-dot" cx="9200" cy="560" r="0" fill="#ffffff" opacity="0" />
        </svg>
      </div>

      <div id="vignette"></div>
      <div id="grain"></div>

      <audio
        id="bgm"
        src="assets/audio/bgm.wav"
        data-start="0"
        data-duration="65"
        data-track-index="10"
        data-volume="0.85"
      ></audio>
    </div>

    <script>

(function () {

      const ART = {

        voice: `
            ${FRAME(ACCENT.voice, [1010, 430])}
          <div class="node" id="node-voice" style="top:196px">${dot(ACCENT.voice)}03 / VOICE</div>

          <div class="detail" id="d-artist-r" style="left:860px;top:250px;width:240px" data-layout-ignore="true">LORA 训练<br/>适配器叠加 · .LUMINA</div>
            <div class="badge-glow" id="badge-glow"></div>
            <svg class="gesture" id="g-artist" viewBox="0 0 1400 1080">
              <circle id="trace-ring" cx="700" cy="356" r="126" />

            <img class="anchor" id="a-artist" src="assets/img/artist-logo.png" style="left:590px;top:246px;width:220px;height:220px" alt="" />

          <div class="node" id="node-animate" style="top:126px">${dot(ACCENT.animate)}05 / ANIMATE</div>

              <g class="ground"><path d="M320 560H1080" /></g>

            <div class="anchor" id="a-animate" style="left:640px;top:164px;width:120px;height:90px">${LOGO.animate}</div>

    return { STUDIOS, LOGO, CAPTION, CAPTION_EN, ART, ACCENT };
  })();
})();

    </script>
    <script>
      // ═════════════════════════════════════════════════════════════════════
      // Lumina — 六座岛，一条光
      //
      // One continuous camera move. Six studios sit on six islands with dark
      // travel beats between them; a single light line runs through the whole
      // film, drawn ahead of the camera. Each studio is woken up by the line in
      // the same order: line change → anchor graphic → logo + wordmark →
      // secondary graphic → caption last. Deterministic: one paused timeline.
      // ═════════════════════════════════════════════════════════════════════

      const { STUDIOS, LOGO, CAPTION, CAPTION_EN, ART, ACCENT } = window.LUMINA;
      const mid = document.getElementById('layer-mid');
      for (const s of STUDIOS) {
        const box = document.createElement('div');
        box.className = 'studio';
        box.id = `st-${s.id}`;
        box.style.left = `${s.x * 0.7 - 700}px`;
        // the studio name in the wordmark is the studio's own accent, pulled 38% toward the ink
        const [ar, ag, ab] = ACCENT[s.id].split(',').map(Number);
        const mix = (c) => Math.round(c * 0.62 + 242 * 0.38);
        box.style.setProperty('--accent-text', `rgb(${mix(ar)},${mix(ag)},${mix(ab)})`);
        box.style.setProperty('--accent-crop', `rgba(${ar},${ag},${ab},0.3)`);
        box.innerHTML = ART[s.id];
        mid.appendChild(box);
        const cap = box.querySelector('#c-' + s.id);
        cap.innerHTML = `${CAPTION[s.id]}<span class="cap-en">${CAPTION_EN[s.id]}</span>`;
        box.querySelectorAll('.node, .metric .lab').forEach((el) => el.setAttribute('data-layout-ignore', 'true'));
      }

      // engine: the wire scatters into 0s and 1s, then every digit returns to a line
      {
        const g = document.getElementById('bits');
        let seed = 20261115;
        const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
        // an even, jittered grid over the whole frame — the bits fill the picture
        // edge to edge instead of clumping around the wire; low opacity, drifting
        const COLS = 13;
        const ROWS = 9;
        const X0 = -40, X1 = 1460, Y0 = 136, Y1 = 966;
        const cw = (X1 - X0) / COLS;
        const chh = (Y1 - Y0) / ROWS;
        const N = COLS * ROWS;
        let svg = '';
        for (let i = 0; i < N; i++) {
          const col = i % COLS;
          const row = Math.floor(i / COLS);
          const x = Math.round(X0 + (col + 0.5) * cw + (rnd() - 0.5) * cw * 0.66);
          const y = Math.round(Y0 + (row + 0.5) * chh + (rnd() - 0.5) * chh * 0.66);
          const lx = Math.round(320 + (i / (N - 1)) * 760);
          const bit = rnd() > 0.5 ? '1' : '0';
          const op = (0.18 + rnd() * 0.17).toFixed(3);
          const fs = 16 + Math.round(rnd() * 6);
          const dx = Math.round((rnd() - 0.5) * 26);
          const dy = Math.round((rnd() - 0.5) * 34);
          svg += `<text class="bit" x="700" y="560" data-x="${x}" data-y="${y}" data-lx="${lx}" data-dx="${dx}" data-dy="${dy}" fill="rgba(242,239,230,${op})" font-family="'JetBrains Mono','Microsoft YaHei',monospace" font-size="${fs}" text-anchor="middle" opacity="0">${bit}</text>`;
        }
        g.innerHTML = svg;
      }

      // voice: the wire turns into an audio spectrum, then gathers into the mark
      {
        const g = document.getElementById('spec-voice');
        const N = 37;
        const STEP = 20;
        const W = 2;
        const x0 = 700 - ((N - 1) * STEP) / 2;
        let svg = '';
        for (let i = 0; i < N; i++) {
          const c = Math.abs(i - (N - 1) / 2) / ((N - 1) / 2);
          const env = Math.pow(1 - c, 0.7);
          const h = Math.round(22 + 120 * env * (0.5 + 0.5 * Math.abs(Math.sin(i * 1.7 + 0.6))));
          svg += `<rect class="spec-bar" x="${x0 + i * STEP}" y="${560 - h}" width="${W}" height="${h}" />`;
        }
        g.innerHTML = svg;
      }

      // ── far layer: distant station silhouettes (parallax 0.3) ──
      const far = document.getElementById('layer-far');
      for (const s of STUDIOS) {
        const st = document.createElement('div');
        st.id = `far-${s.id}`;
        st.setAttribute('data-layout-ignore', 'true');
        st.style.cssText = `position:absolute;left:${s.x * 0.3 - 170}px;top:452px;width:300px;height:210px;opacity:0`;
        st.innerHTML = `
          <div style="position:absolute;inset:0;background:radial-gradient(closest-side,rgba(206,226,255,0.1),rgba(206,226,255,0) 72%)"></div>
          <div style="position:absolute;left:0;bottom:34px;width:100%;height:1px;background:linear-gradient(90deg,rgba(242,239,230,0),rgba(242,239,230,0.16),rgba(242,239,230,0))"></div>
          <div style="position:absolute;left:0;bottom:12px;width:100%;text-align:center;font-family:'JetBrains Mono','Microsoft YaHei',monospace;font-size:12px;letter-spacing:0.26em;color:rgba(242,239,230,0.18)">${s.tag}</div>`;
        far.appendChild(st);
      }

      // ── far backdrop: a very faint measurement grid, 0.3× parallax ──
      {
        const grid = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        grid.setAttribute('viewBox', '0 0 2880 1080');
        grid.setAttribute('width', '2880');
        grid.setAttribute('height', '1080');
        grid.style.cssText = 'position:absolute;left:-40px;top:0;overflow:visible;opacity:0.5';
        let dots = '';
        for (let x = 0; x <= 2880; x += 48) {
          for (let y = 60; y <= 1020; y += 48) dots += `<circle cx="${x}" cy="${y}" r="0.9" fill="rgba(242,239,230,0.10)"/>`;
        }
        grid.innerHTML = dots;
        far.appendChild(grid);
      }

      // ── ruler ticks on the wire ──
      {
        const ticks = document.getElementById('spine-ticks');
        let out = '';
        for (let x = 260; x < 9200; x += 96) {
          const major = (x - 260) % 480 === 0;
          out += `<line x1="${x}" y1="560" x2="${x}" y2="${560 + (major ? 13 : 7)}" stroke="rgba(242,239,230,${major ? 0.3 : 0.16})" stroke-width="1"/>`;
        }
        ticks.innerHTML = out;
      }

      // ── opening: scattered light dots, gathered into one ──
      const lineLayer = document.getElementById('layer-line');
      const P = { x: 250, y: 560 };
      const glow = document.createElement('div');
      glow.className = 'glow';
      glow.style.left = `${P.x}px`;
      glow.style.top = `${P.y}px`;
      lineLayer.appendChild(glow);

      const DOTS = [
        [-620, -300, 0.05, 2.2], [-470, -150, 0.1, 2.4], [-300, -360, 0.15, 2.0],
        [-760, 40, 0.1, 2.6], [-520, 250, 0.2, 2.2], [-180, 330, 0.25, 2.4],
        [420, -330, 0.2, 2.2], [640, -90, 0.3, 2.8], [250, -220, 0.35, 2.4],
        [-380, 90, 0.4, 3.0], [120, 120, 0.45, 2.8], [-120, -140, 0.5, 3.2],
        [330, 240, 0.55, 3.0], [-650, 180, 0.5, 3.4], [520, 300, 0.6, 3.2],
        [780, 150, 0.65, 3.6], [-280, 420, 0.7, 3.4], [160, -420, 0.6, 3.0],
        [-40, 260, 0.8, 3.8], [380, -150, 0.85, 4.0], [-560, -60, 0.75, 3.6],
        [90, -260, 0.9, 4.2], [-200, 60, 0.95, 4.4], [620, 60, 0.9, 4.0],
        [-700, -180, 0.0, 1.9], [-360, -240, 0.15, 2.0], [520, -250, 0.25, 2.1],
        [700, 240, 0.35, 2.3], [-620, 320, 0.45, 2.5], [200, 380, 0.55, 2.7],
        [-480, -420, 0.1, 1.9], [360, 400, 0.75, 3.0], [-80, -380, 0.4, 2.6],
        [760, -20, 0.7, 3.2], [-700, 120, 0.6, 3.0], [480, -60, 0.85, 3.6],
      ];
      const dotEls = DOTS.map(([dx, dy, depth, size]) => {
        const el = document.createElement('div');
        el.className = 'dot';
        const spread = 1 + (1 - depth) * 0.6;
        el.style.left = `${P.x + dx * spread}px`;
        el.style.top = `${P.y + dy * spread}px`;
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.opacity = '0';
        lineLayer.appendChild(el);
        return { el, dx, dy, depth };
      });

      const openCaption = document.createElement('div');
      openCaption.id = 'open-caption';
      openCaption.style.cssText =
        'position:absolute;left:-100px;top:706px;width:700px;text-align:center;font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-size:40px;font-weight:300;letter-spacing:0.03em;color:#f2efe6;opacity:0;white-space:nowrap';
      openCaption.textContent = '把光，留在自己的机器里。';
      lineLayer.appendChild(openCaption);

      // a soft bloom that travels with the head of the light track
      const headGlow = document.createElement('div');
      headGlow.className = 'head-glow';
      lineLayer.appendChild(headGlow);

      const closeMark = document.createElement('div');
      closeMark.id = 'close-mark';
      closeMark.style.cssText =
        'position:absolute;left:9200px;top:940px;transform:translate(-50%,-50%);opacity:0;text-align:center';
      closeMark.innerHTML = `
        <img src="assets/img/mark.svg" alt="" style="width:136px;height:136px;display:block;margin:0 auto 46px" />
        <div style="font-family:'Book Antiqua','Palatino Linotype',Palatino,Georgia,'Microsoft YaHei',serif;font-size:180px;letter-spacing:-0.005em;line-height:1">Lumina</div>
        <div style="margin-top:52px;font-family:'Microsoft YaHei','微软雅黑',sans-serif;font-size:64px;font-weight:300;color:rgba(242,239,230,0.72);white-space:nowrap">能离线就离线，能本地就本地。</div>
        <div id="close-url" style="margin-top:46px;opacity:0">
          <div style="width:96px;height:1px;margin:0 auto 30px;background:rgba(43,98,206,0.75)"></div>
          <div style="font-family:'JetBrains Mono','Microsoft YaHei',monospace;font-size:40px;letter-spacing:0.02em;color:rgba(242,239,230,0.74);white-space:nowrap">https://happy-380.github.io/Lumina-Website</div>
        </div>`;
      lineLayer.appendChild(closeMark);

      // ══ camera rig ══
      const cam = { x: 250, s: 1.02, tail: 250, head: 250 };
      const LAYERS = [
        { el: document.getElementById('layer-far'), p: 0.3 },
        { el: document.getElementById('layer-mid'), p: 0.7 },
        { el: lineLayer, p: 1.0 },
      ];
      const spineWindow = document.getElementById('spine-window');
      const headDot = document.getElementById('head-dot');
      const endDot = document.getElementById('end-dot');

      function render() {
        const { x, s } = cam;
        for (const L of LAYERS) {
          L.el.style.transform = `translate3d(${(960 - s * L.p * x).toFixed(2)}px, ${(540 - s * 540).toFixed(2)}px, 0) scale(${s})`;
        }
        const head = Math.min(9200, Math.max(cam.head, 250 + Math.max(0, x - 250) * 1.1));
        spineWindow.setAttribute('x', cam.tail);
        spineWindow.setAttribute('width', Math.max(0, head - cam.tail));
        headDot.setAttribute('cx', head);
        headDot.setAttribute('opacity', head > 258 ? 0.9 : 0);
        headGlow.style.left = `${head}px`;
        headGlow.style.top = '560px';
      }
      render();

      // ══ the film ══
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const fromTo = (t, a, b, at) => tl.fromTo(t, a, b, at);
      const to = (t, b, at) => tl.to(t, b, at);

      // x is the camera's look-at point: it sits exactly on a studio while the
      // camera is stopped there, so every studio lands dead centre (960). Only
      // the scale drifts inside a stop; x never does.
      const CAMK = [
        [0.0, 250, 1.02, 'none'],
        [6.2, 250, 1.03, 'sine.out'],
        [7.5, 1400, 1.0, 'power3.inOut'],
        [13.0, 1400, 1.004, 'sine.inOut'],
        [14.5, 2900, 1.1, 'power3.inOut'],
        [22.9, 2900, 1.16, 'sine.inOut'],
        [24.0, 4400, 1.0, 'power3.inOut'],
        [29.5, 4400, 0.99, 'sine.inOut'],
        [31.0, 5900, 1.0, 'power3.inOut'],
        [37.0, 5900, 1.012, 'sine.inOut'],
        [38.5, 7400, 1.05, 'power3.inOut'],
        [45.0, 7400, 1.06, 'sine.inOut'],
        [46.5, 8900, 0.92, 'power2.inOut'],
        [56.6, 8900, 0.8, 'sine.inOut'],
        [58.5, 9140, 0.64, 'power2.inOut'],
        [65.0, 9200, 0.6, 'sine.inOut'],
      ];
      let prev = 0;
      for (let i = 1; i < CAMK.length; i++) {
        const [t, x, s, e] = CAMK[i];
        tl.to(cam, { x, s, duration: t - prev, ease: e, onUpdate: render }, prev);
        prev = t;
      }
      tl.eventCallback('onUpdate', render);

      // ── opening ──
      dotEls.forEach((d, i) => {
        const delay = 0.3 + d.depth * 1.8 + (i % 4) * 0.06;
        fromTo(d.el, { opacity: 0 }, { opacity: 0.22 + d.depth * 0.55, duration: 0.7, ease: 'power2.out' }, delay * 0.45);
        to(
          d.el,
          {
            left: P.x + d.dx * 0.05,
            top: P.y + d.dy * 0.05,
            duration: 2.3 + (1 - d.depth) * 0.9,
            ease: 'power2.inOut',
          },
          delay,
        );
        to(d.el, { opacity: 0, scale: 0.4, duration: 0.5, ease: 'power2.in' }, 3.05 + (1 - d.depth) * 0.22);
      });
      fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.9, ease: 'power2.out' }, 3.0);
      fromTo(headGlow, { opacity: 0 }, { opacity: 0.9, duration: 0.9, ease: 'power2.out' }, 3.2);
      fromTo(headDot, { r: 2, opacity: 0 }, { r: 5, opacity: 0.95, duration: 0.5 }, 3.1);
      to(headDot, { r: 8, duration: 0.6, ease: 'power2.out' }, 3.6);
      // the light gathers, the words land — and only then does the track run out
      fromTo(openCaption, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.95, ease: 'power2.out' }, 3.75);
      to(headDot, { r: 4.5, duration: 0.7, ease: 'power2.inOut' }, 4.4);
      to(cam, { head: 1180, duration: 1.5, ease: 'power2.out' }, 5.15);
      to(openCaption, { opacity: 0, y: -8, duration: 0.65, ease: 'power2.in' }, 6.35);

      // ── reveal helpers ──
      const draw = (sel, at, dur, ease) => {
        const list = gsap.utils.toArray(sel);
        list.forEach((p) => {
          const len = p.getTotalLength ? p.getTotalLength() : 100;
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        });
        tl.to(list, { strokeDashoffset: 0, duration: dur, ease: ease || 'power2.inOut', stagger: 0.05 }, at);
      };

      // 01 · AI Core
      {
        const S = 7.5;
        draw('#g-core path', S + 0.2, 1.0);
        to('#node-core', { opacity: 1, duration: 0.6, ease: 'power2.out' }, S + 0.3);
        fromTo('#bubble-core', { opacity: 0 }, { opacity: 1, duration: 0.15 }, S + 1.4);
        draw('#bubble-core path', S + 1.45, 0.95);
        fromTo('#a-core', { opacity: 0, scale: 0.94, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' }, S + 2.55);
        fromTo('#w-core', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, S + 2.95);
        fromTo('#c-core', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.75, ease: 'power2.out' }, S + 3.55);
        to('#g-core', { opacity: 0.28, duration: 0.8 }, S + 3.4);
      }

      // 02 · Engine — the wire scatters into 0s and 1s that fill the frame, the
      // real numbers hold while they drift, then every digit falls back into the beam
      {
        const S = 14.5;
        const bits = gsap.utils.toArray('#g-engine .bit');
        to('#gap-engine', { opacity: 1, duration: 0.4 }, S + 0.28);
        // out: from the wire, evenly across the picture
        bits.forEach((el, i) => {
          fromTo(
            el,
            { opacity: 0, attr: { x: 700, y: 560 } },
            {
              opacity: 1,
              attr: { x: Number(el.dataset.x), y: Number(el.dataset.y) },
              duration: 1.25,
              ease: 'power2.out',
            },
            S + 0.4 + i * 0.004,
          );
        });
        // drift: each glyph wanders like dust, deterministically
        bits.forEach((el, i) => {
          to(
            el,
            {
              x: Number(el.dataset.dx),
              y: Number(el.dataset.dy),
              duration: 1.0 + (i % 5) * 0.1,
              yoyo: true,
              repeat: 1,
              ease: 'sine.inOut',
            },
            S + 1.6 + (i % 11) * 0.03,
          );
        });
        to('#node-engine', { opacity: 1, duration: 0.6, ease: 'power2.out' }, S + 0.4);
        fromTo('#a-engine', { opacity: 0 }, { opacity: 1, duration: 0.7, ease: 'power2.out' }, S + 1.6);
        // the features read while the particles are loose — full size, not margin notes
        fromTo('#f-engine', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.75, ease: 'power2.out' }, S + 1.35);
        to('#f-engine', { opacity: 0, y: -10, duration: 0.5, ease: 'power2.in' }, S + 4.2);
        // back: every digit returns to the wire and lines up — the beam, made of 0s and 1s
        bits.forEach((el, i) => {
          to(
            el,
            {
              attr: { x: Number(el.dataset.lx), y: 560 },
              fontSize: 13,
              x: 0,
              y: 0,
              duration: 0.9,
              ease: 'power2.inOut',
            },
            S + 4.55 + i * 0.0035,
          );
        });
        to('#gap-engine', { opacity: 0, duration: 0.6 }, S + 5.85);
        bits.forEach((el, i) => {
          to(el, { opacity: 0, duration: 0.45, ease: 'power1.in' }, S + 6.1 + i * 0.002);
        });
        fromTo('#w-engine', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, S + 6.5);
        fromTo('#c-engine', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, S + 6.85);
      }

      // 03 · Voice — the wire becomes a spectrum, then gathers into the mark
      {
        const S = 24.0;
        const bars = gsap.utils.toArray('#spec-voice .spec-bar');
        to('#gap-voice', { opacity: 1, duration: 0.3 }, S + 0.22);
        to('#g-voice .spec-base', { opacity: 1, duration: 0.4 }, S + 0.28);
        tl.fromTo(
          bars,
          { scaleY: 0, transformOrigin: '50% 100%' },
          { scaleY: 1, duration: 0.5, ease: 'power2.out', stagger: { each: 0.014, from: 'center' } },
          S + 0.35,
        );
        // the voice moves: each bar breathes on its own beat (no randomness, no loop)
        bars.forEach((b, i) => {
          const peak = 0.42 + ((i * 37) % 100) / 125;
          to(
            b,
            { scaleY: peak, duration: 0.16 + (i % 4) * 0.02, yoyo: true, repeat: 2, ease: 'sine.inOut' },
            S + 1.05 + (i % 9) * 0.045,
          );
        });
        to('#node-voice', { opacity: 1, duration: 0.6, ease: 'power2.out' }, S + 0.5);
        fromTo('#x-voice', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, S + 0.95);
        // collapse: the spectrum is pulled into one short line and the mark takes over
        tl.to(
          bars,
          { scaleY: 0.04, duration: 0.42, ease: 'power2.inOut', stagger: { each: 0.008, from: 'edges' } },
          S + 2.12,
        );
        to('#g-voice .spec-base', { opacity: 0, duration: 0.4 }, S + 2.2);
        to('#spec-voice', { opacity: 0, duration: 0.5 }, S + 2.7);
        to('#x-voice', { opacity: 0, duration: 0.35 }, S + 2.15);
        fromTo('#a-voice', { opacity: 0, scale: 0.9, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.75, ease: 'power3.out' }, S + 2.4);
        to('#gap-voice', { opacity: 0, duration: 0.6 }, S + 3.0);
        fromTo('#w-voice', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, S + 3.1);
        fromTo('#c-voice', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, S + 3.7);
      }

      // 04 · Artist — the line folds and leaves a trace; the badge takes the centre
      {
        const S = 31.0;
        draw('#g-artist .stroke path', S + 0.25, 1.5, 'power1.inOut');
        to('#node-artist', { opacity: 1, duration: 0.6, ease: 'power2.out' }, S + 0.4);
        const ring = document.getElementById('trace-ring');
        const ringLen = ring.getTotalLength ? ring.getTotalLength() : 800;
        gsap.set(ring, { strokeDasharray: `${ringLen}px ${ringLen}px`, strokeDashoffset: ringLen });
        fromTo('#badge-glow', { opacity: 0, scale: 0.86, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 1.1, ease: 'power2.out' }, S + 1.55);
        fromTo('#a-artist', { opacity: 0, scale: 0.94, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.85, ease: 'power3.out' }, S + 1.7);
        tl.to(ring, { strokeDashoffset: 0, duration: 1.0, ease: 'power2.inOut' }, S + 1.95);
        fromTo('#d-artist-l', { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power2.out' }, S + 2.45);
        fromTo('#d-artist-r', { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power2.out' }, S + 2.45);
        fromTo('#w-artist', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, S + 3.0);
        fromTo('#c-artist', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, S + 3.3);
      }

      // 05 · Animate — two characters walk in, stop, look up
      {
        const S = 38.5;
        draw('#g-animate .ground path', S + 0.25, 1.0);
        to('#node-animate', { opacity: 1, duration: 0.6, ease: 'power2.out' }, S + 0.4);
        const girl = document.getElementById('pix-girl');
        const boy = document.getElementById('pix-boy');
        fromTo(girl, { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 1.2, ease: 'power2.out' }, S + 1.2);
        fromTo(boy, { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 1.2, ease: 'power2.out' }, S + 1.45);
        to(girl, { y: -8, duration: 0.16, yoyo: true, repeat: 4, ease: 'sine.inOut' }, S + 1.3);
        to(boy, { y: -8, duration: 0.16, yoyo: true, repeat: 4, ease: 'sine.inOut' }, S + 1.55);
        to([girl, boy], { scale: 1.04, duration: 0.55, ease: 'power2.out', transformOrigin: '50% 100%' }, S + 3.05);
        fromTo('#a-animate', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, S + 3.45);
        fromTo('#w-animate', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, S + 3.8);
        fromTo('#c-animate', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, S + 4.05);
      }

      // 06 · AR — the wire draws an empty rectangle and keeps going as its bottom
      // edge; the two rise out of the wire and come to stand on that edge
      {
        const S = 46.5;
        draw('#g-ar .frame path', S + 0.35, 1.9, 'power1.inOut');
        to('#node-ar', { opacity: 1, duration: 0.6, ease: 'power2.out' }, S + 0.5);
        to('#ar-glass', { opacity: 1, duration: 0.08 }, S + 1.5);
        fromTo('#ar-risers', { y: 230 }, { y: 0, duration: 2.3, ease: 'power2.inOut' }, S + 1.7);
        fromTo('#a-ar', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, S + 4.4);
        fromTo('#w-ar', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power2.out' }, S + 4.85);
        fromTo('#c-ar', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, S + 5.45);
      }

      // ── islands: only the studio the camera is at is on screen ──
      STUDIOS.forEach((s) => {
        const st = document.getElementById('st-' + s.id);
        fromTo(st, { opacity: 0 }, { opacity: 1, duration: 0.55, ease: 'power2.out' }, s.start - 0.75);
        to(st, { opacity: 0, duration: 0.9, ease: 'power2.inOut' }, s.end + 0.28);
      });

      // ── travel beats: the next island wakes in the far distance ──
      STUDIOS.forEach((s, i) => {
        if (i === 0) return;
        fromTo(`#far-${s.id}`, { opacity: 0 }, { opacity: 0.8, duration: 0.9, ease: 'power2.out' }, s.start - 1.25);
        to(`#far-${s.id}`, { opacity: 0.3, duration: 1.1, ease: 'power1.inOut' }, s.start + 0.15);
      });

      // ── close: pull back, the line gathers into one light, the mark lands ──
      to('#close-mark', { opacity: 1, duration: 0.9, ease: 'power2.out' }, 60.5);
      // the project site: on screen, fully legible, for the last three and a half seconds
      fromTo('#close-url', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 60.8);
      to(cam, { tail: 9120, duration: 1.3, ease: 'power2.inOut' }, 59.3);
      to(headDot, { r: 8, duration: 0.8, ease: 'power2.out' }, 60.2);
      fromTo(endDot, { r: 0, opacity: 0 }, { r: 6, opacity: 1, duration: 0.8, ease: 'power2.out' }, 60.3);

      // a full-span sentinel keeps the camera renderer in sync on every seek
      tl.to({ _: 0 }, { _: 1, duration: 65, ease: 'none', onUpdate: render }, 0);

      window.__render = render;
      window.__timelines['main'] = tl;
      tl.seek(0);
      render();
      render();
    </script>
  </body>
</html>
